name: Salient Energy
description: Salient Energy is a Dartmouth, Nova Scotia based clean-energy hardware company developing
  zinc-ion batteries as a safer, lower-cost alternative to lithium-ion for renewable energy storage and
  grid applications. Its cells use a non-toxic, water-based electrolyte that eliminates fire risk, and are
  built from low-cost zinc and manganese materials sourced in North America, with a roughly 50% lower
  production carbon footprint than lithium-ion. The company positions its technology as a scalable answer
  to lithium supply constraints for stationary energy storage. Salient Energy manufactures physical battery
  hardware and does not publish a public developer API, SDK, or developer portal.
